[build]
  base    = "artifacts/neurometric-lab"
  command = "pnpm --filter @workspace/neurometric-lab build"
  publish = "artifacts/neurometric-lab/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://neurometric-terapias-backend.onrender.com"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
