openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Neurometric Lab API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient management
  - name: sessions
    description: Therapy sessions
  - name: goals
    description: Therapy goals
  - name: professionals
    description: Professional staff
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatient"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all therapy sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a therapy session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all therapy goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a therapy goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoal"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoal"
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /professionals:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: List all professionals
      responses:
        "200":
          description: List of professionals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Professional"
    post:
      operationId: createProfessional
      tags: [professionals]
      summary: Create a professional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessional"
      responses:
        "201":
          description: Professional created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [health]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Patient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        email:
          type: string
        phone:
          type: string
        diagnosis:
          type: string
        status:
          type: string
          enum: [active, inactive, discharged]
        professionalId:
          type: integer
        createdAt:
          type: string
      required: [id, name, age, email, status, createdAt]

    CreatePatient:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        email:
          type: string
        phone:
          type: string
        diagnosis:
          type: string
        status:
          type: string
          enum: [active, inactive, discharged]
        professionalId:
          type: integer
      required: [name, age, email, status]

    Session:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        professionalId:
          type: integer
        professionalName:
          type: string
        date:
          type: string
        duration:
          type: integer
        type:
          type: string
          enum: [individual, group, assessment, follow-up]
        notes:
          type: string
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        createdAt:
          type: string
      required: [id, patientId, date, duration, type, status, createdAt]

    CreateSession:
      type: object
      properties:
        patientId:
          type: integer
        professionalId:
          type: integer
        date:
          type: string
        duration:
          type: integer
        type:
          type: string
          enum: [individual, group, assessment, follow-up]
        notes:
          type: string
        status:
          type: string
          enum: [scheduled, completed, cancelled]
      required: [patientId, date, duration, type, status]

    Goal:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [cognitive, behavioral, emotional, social, physical]
        status:
          type: string
          enum: [pending, in-progress, achieved, discontinued]
        targetDate:
          type: string
        createdAt:
          type: string
      required: [id, patientId, title, category, status, createdAt]

    CreateGoal:
      type: object
      properties:
        patientId:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [cognitive, behavioral, emotional, social, physical]
        status:
          type: string
          enum: [pending, in-progress, achieved, discontinued]
        targetDate:
          type: string
      required: [patientId, title, category, status]

    UpdateGoal:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [cognitive, behavioral, emotional, social, physical]
        status:
          type: string
          enum: [pending, in-progress, achieved, discontinued]
        targetDate:
          type: string

    Professional:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        specialty:
          type: string
        license:
          type: string
        status:
          type: string
          enum: [active, inactive]
        patientCount:
          type: integer
        createdAt:
          type: string
      required: [id, name, email, specialty, status, createdAt]

    CreateProfessional:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        specialty:
          type: string
        license:
          type: string
        status:
          type: string
          enum: [active, inactive]
      required: [name, email, specialty, status]

    DashboardStats:
      type: object
      properties:
        totalPatients:
          type: integer
        activeSessions:
          type: integer
        goalsAchieved:
          type: integer
        totalProfessionals:
          type: integer
        sessionsThisWeek:
          type: integer
        newPatientsThisMonth:
          type: integer
      required: [totalPatients, activeSessions, goalsAchieved, totalProfessionals, sessionsThisWeek, newPatientsThisMonth]
