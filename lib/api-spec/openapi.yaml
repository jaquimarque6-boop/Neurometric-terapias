openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Neurometric Lab API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient management
  - name: registros
    description: Session records (CSV data)
  - name: registros-clinicos
    description: Clinical session records
  - name: goal-library
    description: Goal library
  - name: goals
    description: Therapy goals
  - name: professionals
    description: Professional staff
  - name: actividades
    description: Suggested activities
  - name: patient-professionals
    description: Patient-professional assignments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatient"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatient"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Permanently delete a patient and all related data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deletedId:
                    type: integer
                required: [ok, deletedId]

  /registros:
    get:
      operationId: listRegistros
      tags: [registros]
      summary: List all session records
      responses:
        "200":
          description: List of session records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registro"

  /registros/{id}:
    get:
      operationId: getRegistro
      tags: [registros]
      summary: Get session record by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registro"

  /sessions:
    get:
      operationId: listSessions
      tags: [registros]
      summary: List all sessions (alias for registros)
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registro"

  /registros-clinicos:
    get:
      operationId: listRegistrosClinicos
      tags: [registros-clinicos]
      summary: List all clinical session records
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of clinical records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistroClinico"
    post:
      operationId: createRegistroClinico
      tags: [registros-clinicos]
      summary: Create a clinical record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistroClinico"
      responses:
        "201":
          description: Clinical record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroClinico"

  /registros-clinicos/{id}:
    get:
      operationId: getRegistroClinico
      tags: [registros-clinicos]
      summary: Get clinical record by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clinical record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroClinico"
    patch:
      operationId: updateRegistroClinico
      tags: [registros-clinicos]
      summary: Update a clinical record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistroClinico"
      responses:
        "200":
          description: Updated clinical record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroClinico"
    delete:
      operationId: deleteRegistroClinico
      tags: [registros-clinicos]
      summary: Delete a clinical record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all therapy goals
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a therapy goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoal"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoal"
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /actividades:
    get:
      operationId: listActividades
      tags: [actividades]
      summary: List suggested activities
      parameters:
        - name: franjaEtaria
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Actividad"

  /patient-professionals:
    get:
      operationId: listPatientProfessionals
      tags: [patient-professionals]
      summary: List patient-professional assignments
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
        - name: professionalId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientProfessional"
    post:
      operationId: assignPatientProfessional
      tags: [patient-professionals]
      summary: Assign a professional to a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientProfessional"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfessional"

  /patient-professionals/{id}:
    delete:
      operationId: removePatientProfessional
      tags: [patient-professionals]
      summary: Remove a patient-professional assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /professionals:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: List all professionals
      responses:
        "200":
          description: List of professionals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Professional"
    post:
      operationId: createProfessional
      tags: [professionals]
      summary: Create a professional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessional"
      responses:
        "201":
          description: Professional created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"

  /goal-library:
    get:
      operationId: listGoalLibrary
      tags: [goal-library]
      summary: List all library goals
      responses:
        "200":
          description: List of library goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalLibraryItem"

  /goal-library/{id}/assign:
    post:
      operationId: assignGoalToPatient
      tags: [goal-library]
      summary: Assign a library goal to a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignGoalBody"
      responses:
        "201":
          description: Goal assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [health]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Patient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        fechaNacimiento:
          type: string
        diagnosis:
          type: string
        profesionalNombre:
          type: string
        franjaEtaria:
          type: string
        fechaInicio:
          type: string
        progreso:
          type: string
        promedioDesempeno:
          type: number
        semaforo:
          type: string
        observaciones:
          type: string
        totalRegistros:
          type: integer
        createdAt:
          type: string
      required: [id, name, createdAt]

    CreatePatient:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        fechaNacimiento:
          type: string
        diagnosis:
          type: string
        profesionalNombre:
          type: string
        franjaEtaria:
          type: string
        fechaInicio:
          type: string
        observaciones:
          type: string
      required: [name]

    UpdatePatient:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        fechaNacimiento:
          type: string
        diagnosis:
          type: string
        profesionalNombre:
          type: string
        franjaEtaria:
          type: string
        observaciones:
          type: string

    Registro:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        sesionNumero:
          type: integer
        objetivoNombre:
          type: string
        goalLibraryId:
          type: integer
        areaObjetivo:
          type: string
        fecha:
          type: string
        estado:
          type: string
        intentos:
          type: integer
        intentosSugeridos:
          type: integer
        correctas:
          type: integer
        porcentaje:
          type: string
        cumpleMeta:
          type: string
        recomendacionClinica:
          type: string
        createdAt:
          type: string
      required: [id, patientId, createdAt]

    RegistroClinico:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        professionalId:
          type: integer
        professionalName:
          type: string
        fecha:
          type: string
        resumenSesion:
          type: string
        observaciones:
          type: string
        recomendacionesHogar:
          type: string
        createdAt:
          type: string
      required: [id, patientId, fecha, createdAt]

    CreateRegistroClinico:
      type: object
      properties:
        patientId:
          type: integer
        professionalId:
          type: integer
        fecha:
          type: string
        resumenSesion:
          type: string
        observaciones:
          type: string
        recomendacionesHogar:
          type: string
      required: [patientId, fecha]

    UpdateRegistroClinico:
      type: object
      properties:
        professionalId:
          type: integer
        fecha:
          type: string
        resumenSesion:
          type: string
        observaciones:
          type: string
        recomendacionesHogar:
          type: string

    Goal:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        codigo:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        franjaEtaria:
          type: string
        status:
          type: string
          enum: [activo, logrado, suspendido]
        targetDate:
          type: string
        createdAt:
          type: string
      required: [id, patientId, title, category, status, createdAt]

    CreateGoal:
      type: object
      properties:
        patientId:
          type: integer
        codigo:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        franjaEtaria:
          type: string
        status:
          type: string
          enum: [activo, logrado, suspendido]
        targetDate:
          type: string
      required: [patientId, title, category]

    UpdateGoal:
      type: object
      properties:
        codigo:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        franjaEtaria:
          type: string
        status:
          type: string
          enum: [activo, logrado, suspendido]
        targetDate:
          type: string

    Actividad:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
        tipo:
          type: string
        area:
          type: string
        subarea:
          type: string
        franjaEtaria:
          type: string
        recursos:
          type: string
        goalLibraryId:
          type: integer
        objetivoNombre:
          type: string
        createdAt:
          type: string
      required: [id, titulo, tipo, createdAt]

    PatientProfessional:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        professionalId:
          type: integer
        professionalName:
          type: string
        professionalSpecialty:
          type: string
        createdAt:
          type: string
      required: [id, patientId, professionalId, createdAt]

    CreatePatientProfessional:
      type: object
      properties:
        patientId:
          type: integer
        professionalId:
          type: integer
      required: [patientId, professionalId]

    Professional:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        specialty:
          type: string
        license:
          type: string
        status:
          type: string
          enum: [active, inactive]
        patientCount:
          type: integer
        createdAt:
          type: string
      required: [id, name, email, specialty, status, createdAt]

    CreateProfessional:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        specialty:
          type: string
        license:
          type: string
        status:
          type: string
          enum: [active, inactive]
      required: [name, email, specialty, status]

    GoalLibraryItem:
      type: object
      properties:
        id:
          type: integer
        idObjetivo:
          type: string
        nombreObjetivo:
          type: string
        modulo:
          type: string
        area:
          type: string
        subarea:
          type: string
        franjaEtaria:
          type: string
        definicionOperativa:
          type: string
        actividadesClinicas:
          type: string
        actividadesFamilia:
          type: string
        metaPorcentaje:
          type: string
        indicadorTipo:
          type: string
        intentosSugeridos:
          type: string
        marcoConceptual:
          type: string
        nivel1Descripcion:
          type: string
        nivel2Descripcion:
          type: string
        nivel3Descripcion:
          type: string
        recomendacionClinica:
          type: string
        createdAt:
          type: string
      required: [id, idObjetivo, nombreObjetivo, modulo, area, createdAt]

    AssignGoalBody:
      type: object
      properties:
        patientId:
          type: integer
        targetDate:
          type: string
      required: [patientId]

    DashboardStats:
      type: object
      properties:
        totalPatients:
          type: integer
        activeSessions:
          type: integer
        goalsAchieved:
          type: integer
        totalProfessionals:
          type: integer
        sessionsThisWeek:
          type: integer
        newPatientsThisMonth:
          type: integer
      required: [totalPatients, activeSessions, goalsAchieved, totalProfessionals, sessionsThisWeek, newPatientsThisMonth]
