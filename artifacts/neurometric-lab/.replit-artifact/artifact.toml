kind = "web"
previewPath = "/"
title = "Neurometric Lab"
version = "1.0.0"
id = "artifacts/neurometric-lab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20008
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/neurometric-lab run dev"

[services.env]
PORT = "20008"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/neurometric-lab", "run", "build"]
publicDir = "artifacts/neurometric-lab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
